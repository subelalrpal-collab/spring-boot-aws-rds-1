      username: admin
      password: mysqlubqroot

    write.hikari:
      pool-name: WriteHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

    read.hikari:
      pool-name: ReadHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

